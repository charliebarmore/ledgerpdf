name: Linux

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source on Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Electron, display, and viewer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0 libnss3 libgbm1 libasound2 libatk-bridge2.0-0 poppler-utils tesseract-ocr

      - name: Create the engine venv
        run: |
          python3 -m venv engine/.venv
          engine/.venv/bin/pip install --require-hashes -r engine/requirements.lock

      - name: Generate synthetic fixtures
        run: engine/.venv/bin/python spike/run_spike.py

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # Run the real Electron checks with a display and the sandbox enabled.
      # Source coverage only: Linux packaging has a separate verification gap.
      - name: Verify application with a virtual display
        working-directory: app
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run verify

      - name: Reject a recovery launch without a display
        working-directory: app
        run: node scripts/recovery-headless-check.mjs

      - name: Cross-viewer conformance
        working-directory: app
        run: npm run verify:viewers

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-evidence
          retention-days: 3
          if-no-files-found: warn
          path: |
            spike/out/*.png
            spike/out/recovery-headless.log
