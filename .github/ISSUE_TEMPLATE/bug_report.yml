name: Bug report
description: Report reproducible LedgerPDF behavior without client data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never attach a real client document, client-identifying filename, screenshot, or page text. Use the synthetic fixtures when possible."
  - type: input
    id: version
    attributes:
      label: LedgerPDF version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Windows 11 x64 or macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Client-data check
      options:
        - label: I have not included real client or taxpayer information.
          required: true
