<!-- LedgerPDF mark, cream-on-dark variant. Lifted verbatim from the brand kit's
     ledgerpdf-logo-light.svg lockup (the mark group only) so the geometry stays
     identical to ledgerpdf-mark.svg — only the frame ink is recoloured to Paper
     Cream for placement on Deep Teal / Abyss. Tabs keep their brand order and
     colours, which the guide forbids changing. -->
