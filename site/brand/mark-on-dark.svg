  <circle cx="18" cy="18" r="1.8" fill="#FDFCEA"/>
  <circle cx="18" cy="47" r="1.8" fill="#FDFCEA"/>
  <line x1="24" y1="24" x2="45" y2="24" stroke="#FDFCEA" stroke-width="2" opacity="0.5"/>
  <line x1="24" y1="31" x2="45" y2="31" stroke="#FDFCEA" stroke-width="2" opacity="0.5"/>
  <line x1="24" y1="38" x2="45" y2="38" stroke="#FDFCEA" stroke-width="2" opacity="0.5"/>
  <rect x="46" y="14" width="12" height="8" fill="#E8913A"/>
